
{% extends "admin_base.html" %}

{% block content %}

<div class="max-w-7xl mx-auto px-4 md:px-6 py-8">

    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
            <span class="inline-block bg-magenta/10 text-magenta text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-2">
                Management Center
            </span>
            <h1 class="text-2xl md:text-3xl font-extrabold text-gray-800">M-Pesa Orders</h1>
            <p class="text-xs text-gray-500 mt-1">Manage customer orders and payment status</p>
        </div>
    </div>

    <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">

        <div class="p-5 border-b border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="relative max-w-md w-full">
                <input
                    type="text"
                    id="search-orders"
                    placeholder="Search by customer name, phone or ID..."
                    class="w-full pl-10 pr-4 py-2.5 text-xs border border-gray-300 rounded-lg outline-none focus:border-magenta transition-colors"
                >
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                    <i class="fas fa-search text-xs"></i>
                </div>
            </div>

            <button
                onclick="loadOrders(1)"
                class="bg-magenta hover:bg-dark-magenta text-white font-bold text-xs uppercase tracking-wider px-5 py-2.5 rounded-full shadow-sm transition-colors"
            >
                <i class="fas fa-sync-alt mr-1.5"></i> Refresh
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="bg-lightWarm border-b border-gray-100 text-[10px] font-bold text-gray-500 uppercase tracking-wider">
                        <th class="py-4 px-6">Order ID</th>
                        <th class="py-4 px-6">Customer Details</th>
                        <th class="py-4 px-6">City / Town</th>
                        <th class="py-4 px-6">Total</th>
                        <th class="py-4 px-6">Payment Status</th>
                    </tr>
                </thead>

                <tbody id="orders-table-body" class="divide-y divide-gray-50">
                    <tr>
                        <td colspan="5" class="py-12 text-center text-gray-400">
                            <i class="fas fa-spinner fa-spin mr-2"></i>
                            Loading orders...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="p-5 border-t border-gray-100 flex items-center justify-between flex-wrap gap-4">
            <p id="orders-info" class="text-xs text-gray-500 font-semibold"></p>
            <div id="orders-pagination" class="flex items-center gap-2"></div>
        </div>

    </div>
</div>

<script>
let ordersTimer;

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

async function loadOrders(page = 1) {
    const search = document.getElementById("search-orders").value.trim();
    const body = document.getElementById("orders-table-body");
    const info = document.getElementById("orders-info");
    const pagination = document.getElementById("orders-pagination");

    body.innerHTML = `
        <tr>
            <td colspan="5" class="py-12 text-center text-gray-400">
                <i class="fas fa-spinner fa-spin mr-2"></i>
                Loading orders...
            </td>
        </tr>
    `;

    try {
        const response = await fetch(
            `/api/admin/orders?page=${page}&q=${encodeURIComponent(search)}`
        );

        if (!response.ok) {
            throw new Error("Failed to load orders");
        }

        const data = await response.json();

        body.innerHTML = "";

        if (!data.items.length) {
            body.innerHTML = `
                <tr>
                    <td colspan="5" class="py-12 text-center text-gray-400">
                        <i class="fas fa-shopping-cart text-2xl mb-2 block"></i>
                        No orders found
                    </td>
                </tr>
            `;
        } else {
            data.items.forEach(order => {
                let statusClass = "bg-yellow-100 text-yellow-700";

                if (order.status === "PAID") {
                    statusClass = "bg-green-100 text-green-700";
                } else if (order.status === "FAILED") {
                    statusClass = "bg-red-100 text-red-600";
                } else if (order.status === "DISPATCHED") {
                    statusClass = "bg-blue-100 text-blue-700";
                }

                body.insertAdjacentHTML("beforeend", `
                    <tr class="hover:bg-gray-50/50 transition-colors">

                        <td class="py-4 px-6 font-bold text-gray-700 tracking-wider">
                            ${escapeHtml(order.id)}
                        </td>

                        <td class="py-4 px-6">
                            <p class="font-semibold text-gray-700">
                                ${escapeHtml(order.name)}
                            </p>
                            <p class="text-[10px] text-gray-400 mt-0.5">
                                ${escapeHtml(order.phone)}
                            </p>
                        </td>

                        <td class="py-4 px-6 text-gray-600">
                            ${escapeHtml(order.city || "N/A")}
                        </td>

                        <td class="py-4 px-6 font-bold text-magenta">
                            ${Number(order.grand_total || 0).toLocaleString()}
                        </td>

                        <td class="py-4 px-6">
                            <span class="inline-block px-2.5 py-1 rounded-full text-[9px] font-bold uppercase tracking-wider ${statusClass}">
                                ${escapeHtml(order.status || "PENDING")}
                            </span>
                        </td>

                    </tr>
                `);
            });
        }

        info.textContent = data.total
            ? `Showing page ${data.page} of ${data.pages} • ${data.total} orders`
            : "No orders";

        pagination.innerHTML = `
            <button
                onclick="loadOrders(${data.page - 1})"
                ${!data.has_prev ? "disabled" : ""}
                class="w-8 h-8 rounded-lg border border-gray-200 text-gray-500 hover:border-magenta hover:text-magenta disabled:opacity-30 disabled:cursor-not-allowed"
            >
                <i class="fas fa-chevron-left text-[10px]"></i>
            </button>

            <span class="px-2 text-xs font-bold text-gray-600">
                ${data.page} / ${Math.max(data.pages, 1)}
            </span>

            <button
                onclick="loadOrders(${data.page + 1})"
                ${!data.has_next ? "disabled" : ""}
                class="w-8 h-8 rounded-lg border border-gray-200 text-gray-500 hover:border-magenta hover:text-magenta disabled:opacity-30 disabled:cursor-not-allowed"
            >
                <i class="fas fa-chevron-right text-[10px]"></i>
            </button>
        `;

    } catch (error) {
        body.innerHTML = `
            <tr>
                <td colspan="5" class="py-12 text-center text-red-500">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    Failed to load orders
                </td>
            </tr>
        `;

        info.textContent = "";
        pagination.innerHTML = "";
    }
}

document.getElementById("search-orders").addEventListener("input", function() {
    clearTimeout(ordersTimer);

    ordersTimer = setTimeout(() => {
        loadOrders(1);
    }, 300);
});

document.addEventListener("DOMContentLoaded", () => {
    loadOrders();
});
</script>

{% endblock %}

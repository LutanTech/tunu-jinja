{% extends "admin_base.html" %}
{% block content %}
<script src="/static/assets/tailwind.js"></script>
<style>
    :root {
        --magenta: #8B008B;
        --dark-magenta: #5c005c;
        --orangered: #FF4500;
        --soft-bg: #fdf2f2;
    }

    #registerForm{
        display:flex;
        flex-wrap: wrap;
        gap: 5px;
    }

    .auth-card {
        flex-grow: 1;
        background: rgb(255, 255, 255);
        box-shadow: 0 15px 35px rgba(139, 0, 139, 0.1);
        width: 100%;
        min-height: 89vh;
        overflow: hidden;
        border: 1px solid rgba(139, 0, 139, 0.05);
    }
    .brand-header {
        background: var(--magenta);
        padding: 30px;
        text-align: center;
        color: white;
    }
    .input-group {
        position: relative;
        margin-bottom: 18px;
        flex-grow: 1;
        width: max-content;
        display: flex;
        flex-direction: column;
        label{
            font-size: small;
        }
    }
    .input-group i {
        position: absolute;
        left: 15px;
        top: 65%;
        transform: translateY(-50%);
        color: #999;
        transition: color 0.3s;
    }
    .input-field {
        width: 100%;
        padding: 10px 10px 10px 45px;
        border: 1px solid #00000030;
        outline: none;
        min-width: 300px; 
        max-width: 400px;
        transition: all 0.3s;
        font-size: 10px;
    }
    .input-field:focus {
        border-color: var(--magenta);
        box-shadow: 0 0 0 4px rgba(139, 0, 139, 0.1);
    }
    .input-field:focus + i {
        color: var(--magenta);
    }
    .btn-register {
        background: var(--orangered);
        color: white;
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: all 0.3s;
        box-shadow: 0 5px 15px rgba(255, 69, 0, 0.2);
    }
    .btn-register:hover {
        background: #e63e00;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(255, 69, 0, 0.3);
    }
    .error-box {
        background: #fff5f5;
        border-left: 4px solid #ff4d4d;
        color: #d63031;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    input::-webkit-file-upload-button{
        scale: 0.8;
        
    }

.listDiv{
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}
.menu-item{
    display: flex;
    background: whitesmoke;
    padding: 5px 9px;
    font-size: 14px;
    border-radius: 4px;
    border: 1px solid rgba(0, 0, 0, 0.238);
    cursor: pointer;
    user-select: none;
    position: relative;
    &:hover{
        background: magenta;
        color: white;
    }
    
}
.menu-item.selected{
    background: magenta;
    color: white;
    &::after{
        background: black;
        border-radius: 50%;
        padding: 4px;
        content: '✔';
        max-height: 15px;
        position: absolute;
        font-size: 9px;
        top: -4px;
        display: flex;
        align-items: center;
        justify-content: center;
        right: -5px;
        color: white;
    }
}
</style>
    <div class="cards-holder">
    <div class="auth-card">
        <div class="p-8">
            <!-- Flask Error Message Display -->
            {% if error %}
            <div class="error-box">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/register" method="POST" id="registerForm">
                <div class="input-group">
                    <label for="name">Enter Staff Name</label>
                    <input type="text" name="name" class="input-field" id="name" placeholder="Full Name" required>
                    <i class="fas fa-user-tie"></i>
                </div>

                <div class="input-group">
                    <label for="email">Enter Staff Email</label>
                    <input type="email" id="email" name="email" class="input-field" placeholder="Email Address">
                    <i class="fas fa-envelope"></i>
                </div>

                <div class="input-group">
                    <label for="phone">Enter Staff Phone</label>
                    <input type="tel" name="phone" class="input-field" placeholder="Phone Number (e.g. 07...)" required>
                    <i class="fas fa-phone-alt"></i>
                </div>

                <div class="input-group">
                    <label for="location">Enter Staff Location</label>
                    <input type="adress" name="location" class="input-field" placeholder="Eg, Nairobi" required>
                    <i class="fas fa-map-pin"></i>
                </div>

                <div class="input-group">
                    <label for="name">Select Staff Department</label>
                    <select  name="department" class="input-field" id="department" required>
                    <option value="">--select--</option>
                    <option value="editorial">Editorial</option>
                    <option value="welfare">Welfare</option>
                    <option value="ict">ICT</option>
                    <option value="dispatch">Dispatch</option>
                    <option value="marketing">Marketing</option>
                    </select>
                    <i class="fas fa-building"></i>

                </div>

                <div class="input-group">
                    <label for="email">Enter Staff Photo</label>
                    <input type="file" id="photo" name="photo" class="input-field" accept="image/*" >
                    <i class="fas fa-image"></i>
                </div>

                <div>
                    <label for="phone">Edit Staff menu </label>
                    <div class="listDiv"></div>
                </div>



<hr style="width: 100%;">
                <button type="submit" class="btn-register" style="max-width: fit-content;">
                    <i class="fas fa-user-plus"></i>
                    COMPLETE REGISTRATION
                </button>

            </form>
        </div>
    </div>
    </div>

    <script>

        const items = ["support", "chat", "reports", "work", "orders", "memos"]

        document.addEventListener('DOMContentLoaded', ()=>{
            const listDiv = document.querySelector('.listDiv')

            items.forEach(i=>{
                const iDiv = document.createElement('div')
                iDiv.className = 'menu-item'
                const sanitized =  String(i).replaceAll('_', ' ')
                iDiv.innerHTML = String(sanitized).charAt(0).toLocaleUpperCase() + String(sanitized).slice(1)
                listDiv.appendChild(iDiv)
                iDiv.addEventListener('click', ()=>{
                    iDiv.classList.toggle('selected')
                })

            })
        })

        function togglePass() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Basic form validation feedback
        document.getElementById('registerForm').onsubmit = function() {
            const btn = document.querySelector('.btn-register');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> CREATING ACCOUNT...';
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
        };
    </script>
{% endblock %}

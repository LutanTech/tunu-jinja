{% extends "admin_base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 md:px-6 py-8">
    <div class="flex items-center gap-3 mb-6">
        <a href="/cp" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center transition-colors">
            <i class="fas fa-arrow-left text-xs"></i>
        </a>
        <div>
            <span class="inline-block bg-magenta/10 text-magenta text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-1">Catalog Management</span>
            <h1 class="text-2xl font-extrabold text-gray-800">Edit Book</h1>
        </div>
    </div>

    <form action="/cp/books/edit/{{ book.id }}" method="POST" enctype="multipart/form-data" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 flex flex-col gap-6">
            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm flex flex-col gap-4">
                <h3 class="font-bold text-xs text-gray-800 uppercase tracking-wider border-l-2 border-orangered pl-2 mb-2">Book Information</h3>
                
                <div>
                    <label for="title" class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Book Title</label>
                    <input type="text" id="title" name="title" required value="{{ book.title }}" placeholder="e.g. Fundo la Moyoni" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-xs outline-none focus:border-magenta transition-colors">
                </div>

                <div>
                    <label for="authors" class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Author(s)</label>
                    <input type="text" id="authors" name="authors" value="{{ book.authors or '' }}" placeholder="e.g. Tunu Publishers" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-xs outline-none focus:border-magenta transition-colors">
                </div>

                <div>
                    <label for="blurb" class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Blurb / Description</label>
                    <textarea id="blurb" name="blurb" rows="6" placeholder="Write a short engaging summary of the book..." class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-xs outline-none focus:border-magenta transition-colors resize-none">{{ book.blurb or '' }}</textarea>
                </div>
            </div>

            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm flex flex-col gap-4">
                <h3 class="font-bold text-xs text-gray-800 uppercase tracking-wider border-l-2 border-orangered pl-2 mb-2">Target & Grading</h3>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="audience" class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">
                            Target Audience
                        </label>
                
                        <select id="audience" name="audience" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-xs outline-none focus:border-magenta transition-colors bg-white appearance-none text-gray-700">
                
                            <optgroup label="General">
                                <option value="General" {% if book.audience == 'General' %}selected{% endif %}>General Readers</option>
                                <option value="Adults" {% if book.audience == 'Adults' %}selected{% endif %}>Adults</option>
                                <option value="Young Adults" {% if book.audience == 'Young Adults' %}selected{% endif %}>Young Adults</option>
                            </optgroup>
                
                            <optgroup label="Education">
                                <option value="Students" {% if book.audience == 'Students' %}selected{% endif %}>Students</option>
                                <option value="Primary Students" {% if book.audience == 'Primary Students' %}selected{% endif %}>Primary Students</option>
                                <option value="Secondary Students" {% if book.audience == 'Secondary Students' %}selected{% endif %}>Secondary Students</option>
                                <option value="Tertiary Students" {% if book.audience == 'Tertiary Students' %}selected{% endif %}>Tertiary Students</option>
                                <option value="Teachers" {% if book.audience == 'Teachers' %}selected{% endif %}>Teachers / Instructors</option>
                                <option value="Researchers" {% if book.audience == 'Researchers' %}selected{% endif %}>Researchers</option>
                                <option value="Education Professionals" {% if book.audience == 'Education Professionals' %}selected{% endif %}>Education Professionals</option>
                            </optgroup>
                
                            <optgroup label="Children & Youth">
                                <option value="Children" {% if book.audience == 'Children' %}selected{% endif %}>Children</option>
                                <option value="Early Readers" {% if book.audience == 'Early Readers' %}selected{% endif %}>Early Readers</option>
                                <option value="Teenagers" {% if book.audience == 'Teenagers' %}selected{% endif %}>Teenagers</option>
                                <option value="Young Readers" {% if book.audience == 'Young Readers' %}selected{% endif %}>Young Readers</option>
                            </optgroup>
                
                            <optgroup label="Professional">
                                <option value="Professionals" {% if book.audience == 'Professionals' %}selected{% endif %}>Professionals</option>
                                <option value="Business Owners" {% if book.audience == 'Business Owners' %}selected{% endif %}>Business Owners</option>
                                <option value="Writers" {% if book.audience == 'Writers' %}selected{% endif %}>Writers</option>
                                <option value="Authors" {% if book.audience == 'Authors' %}selected{% endif %}>Authors</option>
                            </optgroup>
                
                        </select>
                    </div>
                
                    <div>
                        <label for="grade" class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">
                            Education Grade / Category
                        </label>
                
                        <select id="grade" name="grade" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-xs outline-none focus:border-magenta transition-colors bg-white appearance-none text-gray-700">
                
                            <optgroup label="Education">
                                <option value="Grade 1" {% if book.grade == 'Grade 1' %}selected{% endif %}>Grade 1</option>
                                <option value="Grade 2" {% if book.grade == 'Grade 2' %}selected{% endif %}>Grade 2</option>
                                <option value="Grade 3" {% if book.grade == 'Grade 3' %}selected{% endif %}>Grade 3</option>
                                <option value="Grade 4" {% if book.grade == 'Grade 4' %}selected{% endif %}>Grade 4</option>
                                <option value="Grade 5" {% if book.grade == 'Grade 5' %}selected{% endif %}>Grade 5</option>
                                <option value="Grade 6" {% if book.grade == 'Grade 6' %}selected{% endif %}>Grade 6</option>
                                <option value="Grade 7" {% if book.grade == 'Grade 7' %}selected{% endif %}>Grade 7</option>
                                <option value="Grade 8" {% if book.grade == 'Grade 8' %}selected{% endif %}>Grade 8</option>
                                <option value="Grade 9" {% if book.grade == 'Grade 9' %}selected{% endif %}>Grade 9</option>
                                <option value="Grade 10" {% if book.grade == 'Grade 10' %}selected{% endif %}>Grade 10</option>
                                <option value="Grade 11" {% if book.grade == 'Grade 11' %}selected{% endif %}>Grade 11</option>
                                <option value="Grade 12" {% if book.grade == 'Grade 12' %}selected{% endif %}>Grade 12</option>
                                <option value="Junior Secondary" {% if book.grade == 'Junior Secondary' %}selected{% endif %}>Junior Secondary</option>
                                <option value="Secondary" {% if book.grade == 'Secondary' %}selected{% endif %}>Senior Secondary</option>
                                <option value="Adult / Tertiary" {% if book.grade == 'Adult / Tertiary' %}selected{% endif %}>Adult / Tertiary</option>
                            </optgroup>
                
                            <optgroup label="Literature">
                                <option value="General" {% if book.grade == 'General' %}selected{% endif %}>General</option>
                                <option value="Fiction" {% if book.grade == 'Fiction' %}selected{% endif %}>Fiction</option>
                                <option value="Poetry" {% if book.grade == 'Poetry' %}selected{% endif %}>Poetry</option>
                                <option value="Drama" {% if book.grade == 'Drama' %}selected{% endif %}>Drama</option>
                                <option value="Short Stories" {% if book.grade == 'Short Stories' %}selected{% endif %}>Short Stories</option>
                                <option value="Novels" {% if book.grade == 'Novels' %}selected{% endif %}>Novels</option>
                                <option value="Creative Writing" {% if book.grade == 'Creative Writing' %}selected{% endif %}>Creative Writing</option>
                                <option value="African Literature" {% if book.grade == 'African Literature' %}selected{% endif %}>African Literature</option>
                            </optgroup>
                
                            <optgroup label="Children">
                                <option value="Children's Books" {% if book.grade == "Children's Books" %}selected{% endif %}>Children's Books</option>
                                <option value="Picture Books" {% if book.grade == 'Picture Books' %}selected{% endif %}>Picture Books</option>
                                <option value="Storybooks" {% if book.grade == 'Storybooks' %}selected{% endif %}>Storybooks</option>
                                <option value="Early Readers" {% if book.grade == 'Early Readers' %}selected{% endif %}>Early Readers</option>
                                <option value="Young Adult" {% if book.grade == 'Young Adult' %}selected{% endif %}>Young Adult</option>
                            </optgroup>
                
                            <optgroup label="Academic & Professional">
                                <option value="Academic" {% if book.grade == 'Academic' %}selected{% endif %}>Academic</option>
                                <option value="Reference" {% if book.grade == 'Reference' %}selected{% endif %}>Reference</option>
                                <option value="Research" {% if book.grade == 'Research' %}selected{% endif %}>Research</option>
                                <option value="Professional" {% if book.grade == 'Professional' %}selected{% endif %}>Professional</option>
                                <option value="Business" {% if book.grade == 'Business' %}selected{% endif %}>Business</option>
                                <option value="Technology" {% if book.grade == 'Technology' %}selected{% endif %}>Technology</option>
                            </optgroup>
                
                            <optgroup label="Other">
                                <option value="Biography" {% if book.grade == 'Biography' %}selected{% endif %}>Biography</option>
                                <option value="History" {% if book.grade == 'History' %}selected{% endif %}>History</option>
                                <option value="Religion" {% if book.grade == 'Religion' %}selected{% endif %}>Religion</option>
                                <option value="Self Help" {% if book.grade == 'Self Help' %}selected{% endif %}>Self Help</option>
                                <option value="Health" {% if book.grade == 'Health' %}selected{% endif %}>Health</option>
                                <option value="Politics & Society" {% if book.grade == 'Politics & Society' %}selected{% endif %}>Politics & Society</option>
                                <option value="Culture" {% if book.grade == 'Culture' %}selected{% endif %}>Culture</option>
                                <option value="General Interest" {% if book.grade == 'General Interest' %}selected{% endif %}>General Interest</option>
                            </optgroup>
                
                        </select>
                    </div>
                    <div>
                        <label for="category" class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">
                            Category
                        </label>
                    
                        <select id="category" name="category" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-xs outline-none focus:border-magenta transition-colors bg-white appearance-none text-gray-700">
                            <option value="General" {% if book.category == 'General' %}selected{% endif %}>General Interest</option>
                            <option value="Fiction" {% if book.category == 'Fiction' %}selected{% endif %}>Fiction</option>
                            <option value="Poetry" {% if book.category == 'Poetry' %}selected{% endif %}>Poetry</option>
                            <option value="Drama" {% if book.category == 'Drama' %}selected{% endif %}>Drama</option>
                            <option value="Novels" {% if book.category == 'Novels' %}selected{% endif %}>Novels</option>
                            <option value="Short Stories" {% if book.category == 'Short Stories' %}selected{% endif %}>Short Stories</option>
                            <option value="Picture Books" {% if book.category == 'Picture Books' %}selected{% endif %}>Picture Books</option>
                            <option value="Storybooks" {% if book.category == 'Storybooks' %}selected{% endif %}>Storybooks</option>
                            <option value="Children's Books" {% if book.category == "Children's Books" %}selected{% endif %}>Children's Books</option>
                            <option value="Early Readers" {% if book.category == 'Early Readers' %}selected{% endif %}>Early Readers</option>
                            <option value="Academic" {% if book.category == 'Academic' %}selected{% endif %}>Academic</option>
                            <option value="Reference" {% if book.category == 'Reference' %}selected{% endif %}>Reference</option>
                            <option value="Biography" {% if book.category == 'Biography' %}selected{% endif %}>Biography</option>
                            <option value="History" {% if book.category == 'History' %}selected{% endif %}>History</option>
                            <option value="Religion" {% if book.category == 'Religion' %}selected{% endif %}>Religion</option>
                            <option value="Gudance" {% if book.category == 'Guidance' %}selected{% endif %}>Guidance</option>
                            <option value="Self Help" {% if book.category == 'Self Help' %}selected{% endif %}>Self Help</option>
                            <option value="Business" {% if book.category == 'Business' %}selected{% endif %}>Business</option>
                            <option value="Technology" {% if book.category == 'Technology' %}selected{% endif %}>Technology</option>
                            <option value="Health" {% if book.category == 'Health' %}selected{% endif %}>Health</option>
                            <option value="Culture" {% if book.category == 'Culture' %}selected{% endif %}>Culture</option>
                            <option value="African Literature" {% if book.category == 'African Literature' %}selected{% endif %}>African Literature</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="md:col-span-1 flex flex-col gap-6">
            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm flex flex-col gap-4">
                <h3 class="font-bold text-xs text-gray-800 uppercase tracking-wider border-l-2 border-orangered pl-2 mb-2">Cover Artwork</h3>
                
                <div class="flex flex-col items-center gap-4">
                    <div class="w-36 h-48 rounded-xl bg-lightWarm border border-gray-200 overflow-hidden flex items-center justify-center relative shadow-inner">
                        <img id="cover-preview" src="{{ book.image_url }}" alt="Cover Preview" class="w-full h-full object-contain p-2" onerror="this.src='https://placehold.co/150x200/F5F5DC/8B008B?text=No+Cover'">
                    </div>
                    
                    <div class="w-full">
                        <label class="block w-full text-center border border-dashed border-gray-300 hover:border-magenta hover:bg-magenta/5 transition-all cursor-pointer py-3 px-4 rounded-xl text-xs font-bold text-gray-600">
                            <i class="fas fa-cloud-upload-alt mr-1 text-magenta"></i> Change Cover Image
                            <input type="file" id="image" name="image" accept="image/*" class="hidden" onchange="previewImage(event)">
                        </label>
                    </div>
                </div>
            </div>

            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm flex flex-col gap-4">
                <h3 class="font-bold text-xs text-gray-800 uppercase tracking-wider border-l-2 border-orangered pl-2 mb-2">Pricing Details</h3>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="oldPrice" class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Original (KSh)</label>
                        <input type="number" id="oldPrice" name="oldPrice" min="0" value="{{ book.oldPrice or 0 }}" step="1" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-xs outline-none focus:border-magenta transition-colors">
                    </div>
                    <div>
                        <label for="newPrice" class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Selling (KSh)</label>
                        <input type="number" id="newPrice" name="newPrice" min="0" required value="{{ book.newPrice or 0 }}" step="1" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-xs outline-none focus:border-magenta transition-colors">
                    </div>
                </div>

                <label class="flex items-center gap-2.5 mt-2 cursor-pointer select-none">
                    <input type="checkbox" id="discounted" name="discounted" value="true" class="w-4 h-4 rounded text-magenta border-gray-300 focus:ring-magenta" {% if book.discounted %}checked{% endif %}>
                    <span class="text-xs font-semibold text-gray-600">Mark as discounted offer</span>
                </label>
            </div>

            <div class="flex flex-col gap-3">
                <button type="submit" class="w-full bg-magenta hover:bg-dark-magenta text-white font-bold text-xs uppercase tracking-wider py-4 rounded-full shadow-md transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-check-circle"></i> Save Changes
                </button>
                <a href="/cp" class="w-full inline-block text-center bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs uppercase tracking-wider py-4 rounded-full transition-colors">
                    Cancel
                </a>
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.getElementById('cover-preview');
            output.src = reader.result;
        };
        if (event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    }
</script>
{% endblock %}
